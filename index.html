<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0 to 100 — Team App</title>
    <meta name="description" content="App web officielle de la team 0 to 100" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <main class="app-shell">

      <header class="hero">
        <img
          class="brand-logo"
          src="https://0-to-100.gs-paths.fr/wp-content/uploads/2025/02/0-to-100-Logo-Bleu-RVB.png"
          alt="Logo 0 to 100"
        />
        <p class="kicker">Team Tracker</p>
      </header>

      <section id="onboarding-card" class="glass-card" aria-labelledby="onboarding-title">
        <h2 id="onboarding-title">Première visite</h2>
        <form id="onboarding-form">
          <div class="field">
            <label for="first-name">Prénom</label>
            <input id="first-name" name="firstName" type="text" maxlength="40" required placeholder="Ton prénom" />
          </div>
          <div class="field">
            <label for="track">Parcours</label>
            <select id="track" name="track" required>
              <option value="0to100">0 to 100 (CCC)</option>
              <option value="0to40">0 to 40 (MCC)</option>
            </select>
          </div>
          <div class="field">
            <label for="utmb-scenario">Semaine UTMB 2027</label>
            <select id="utmb-scenario" name="utmbScenario" required>
              <option value="week1">23 — 29 août 2027</option>
              <option value="week2">30 août — 5 sept. 2027</option>
            </select>
          </div>
          <button type="submit" class="btn-primary">C'est parti →</button>
        </form>
      </section>

      <section id="tracker-card" class="glass-card hidden">
        <div class="stats-row">
          <div class="ring-container">
            <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
              <circle class="ring-track" cx="60" cy="60" r="52" />
              <circle class="ring-fill" id="progress-ring" cx="60" cy="60" r="52" />
            </svg>
            <div class="ring-inner">
              <span class="ring-pct" id="progress-pct">0%</span>
              <span class="ring-sublabel">complété</span>
            </div>
          </div>
          <div class="stats-aside">
            <div class="stat-block">
              <span class="stat-val" id="dodos-value">—</span>
              <span class="stat-lbl">dodos restants</span>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-block">
              <span class="stat-val" id="streak-value">0</span>
              <span class="stat-lbl">streak</span>
            </div>
          </div>
        </div>
        <div class="profile-meta">
          <p id="welcome-line"></p>
          <p id="project-line"></p>
        </div>
        <button id="reset-profile" type="button" class="btn-ghost">Modifier mon profil</button>
      </section>

      <section id="calendar-card" class="glass-card hidden" aria-labelledby="calendar-title">
        <h2 id="calendar-title">Calendrier</h2>
        <p id="calendar-meta" class="calendar-meta-line"></p>
        <div id="calendar-list" class="calendar-list"></div>
      </section>

      <footer class="app-footer">
        <span>v<strong id="app-version"></strong></span>
        <span>0 to 100 Team</span>
      </footer>

    </main>

    <div id="celebration-layer" class="celebration-layer hidden" aria-live="polite"></div>

    <script src="scripts/config.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
